[package]
name = "RallyDesk"
version = "1.2.43"
description = "RallyDesk Desktop"
authors = ["RallyDesk Team"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "RallyDesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "image-ico", "image-png", "custom-protocol"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
tauri-plugin-single-instance = "2.5.5"
